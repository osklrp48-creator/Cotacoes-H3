services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: h3
      POSTGRES_PASSWORD: h3
      POSTGRES_DB: cotacoes
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # porta 5433 no seu computador, para não conflitar com um Postgres local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U h3 -d cotacoes"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://h3:h3@db:5432/cotacoes
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_postgres:
