# Blueprint do Render — plano GRATUITO.
# O site roda no plano Free do Render; o banco fica no Neon (PostgreSQL gratuito que não expira),
# porque o banco gratuito do próprio Render é apagado depois de um tempo.
# No Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: cotacoes-h3
    runtime: docker
    plan: free
    healthCheckPath: /api/saude
    envVars:
      # Cole aqui a "connection string" do Neon (postgresql://...neon.tech/...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Primeiro admin, criado automaticamente na primeira vez que o sistema sobe (banco vazio).
      - key: ADMIN_NOME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: ADMIN_UNIDADE
        value: Matriz
      - key: IA_PROVEDOR
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # Reserva gratuita: se o Gemini falhar por cota/sobrecarga, lê com o Groq (console.groq.com)
      - key: GROQ_API_KEY
        sync: false
